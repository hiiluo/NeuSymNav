name: CPU checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and CPU test dependencies
        run: python -m pip install -e '.[dev,ui]'
      - name: Check tracked source payload
        run: python tools/check_github_payload.py
      - name: Run CPU suite
        run: python -m pytest tests -q -m 'not native'
      - name: Check source-only CLI
        run: |
          neusymnav --help
          neusymnav preflight --config tests/fixtures/launcher/config.yaml
