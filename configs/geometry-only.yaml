    - 160
    position_xyz:
    - 0.0
    - 1.0
    - 0.0
    orientation_xyz_rad:
    - -1.5707963267948966
    - 0.0
    - 0.0
    hfov_deg: 120.0
    depth_min_m: 0.1
    depth_max_m: 10.0
  scene: null
