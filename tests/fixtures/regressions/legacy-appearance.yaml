schema_version: 1
appearance_mode: off # off | openclip; no appearance work is scheduled by default.

worker:
  # Required when appearance_mode=openclip. Use an isolated environment that
  # already contains NumPy, Pillow, PyTorch, OpenCLIP and safetensors.
  python_path: null # Absolute executable interpreter path.
  checkpoint_path: null # Absolute local .safetensors file; .pt is unsupported.
  checkpoint_sha256: null # Required digest of that exact local file.
  checkpoint_format: safetensors
  model_name: ViT-B-32
  preprocessing_id: openclip-vit-b-32-openai-eval-224-maskbboxpad20-v1
  crop_recipe_id: mask-tight-xyxy+20px-clipped+PIL-float-edge-rounding-v1
  feature_dimension: 512
  device: cpu # Worker loading and image inference are CPU-only.
  pretrained: null # Always construct with pretrained=None; only strict local weights load.
  state_dict_strict: true
  timeout_s: 2.0
  startup_timeout_s: 30.0
  max_request_bytes: 33554432
  max_response_bytes: 2097152

provenance:
  source_adapter: Fusion/integration_v2/perception_feature_sessions.py
  crop_and_normalization: Fusion/scripts/extract_u2_appearance.py
  conceptgraphs_reference:
    - Fusion/ref_ConceptGraph/concept-graphs/conceptgraph/slam/utils.py
    - Fusion/ref_ConceptGraph/concept-graphs/conceptgraph/slam/mapping.py
  feature_scope: image embedding only; no text feature, semantic relabeling, or identity decision.
  mask_policy: derive tight pixel-edge bbox; keep original RGB pixels; do not black out by mask.
  source_geometry: source FrameKey and geometry_hash are verified by host before and after IPC.
  model_compatibility: unverified until an approved local checkpoint passes strict ViT-B-32 loading.
